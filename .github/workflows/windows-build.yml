name: Windows build

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout (including GPL capture engine)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Set up CMake
        uses: lukka/get-cmake@latest

      - name: Build native USB host
        run: |
          cmake -S usb-host -B build/usb-host -A x64
          cmake --build build/usb-host --config Release --target iphone-usb-host

      - name: Stage native host beside application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src/SmaetRec.App/resources/usb | Out-Null
          Copy-Item build/usb-host/package/usb/* src/SmaetRec.App/resources/usb/ -Force

      - name: Restore and test managed projects
        run: dotnet test SmaetRec.sln --configuration Release

      - name: Publish self-contained Windows x64 application
        run: dotnet publish src/SmaetRec.App/SmaetRec.App.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=false -o artifacts/SMAET-REC

      - name: Upload complete application
        uses: actions/upload-artifact@v4
        with:
          name: SMAET-REC-Windows-x64
          path: artifacts/SMAET-REC
          if-no-files-found: error
          retention-days: 30
