name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      SMAET_ARTIFACTS: ${{ github.workspace }}\artifacts
      DOTNET_NOLOGO: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build SmaetRec.sln -c Release
      - name: Unit tests
        run: dotnet test tests/SmaetRec.Tests -c Release --no-build --logger "console;verbosity=normal"
      - name: Windows tests (capture, recording, decoding)
        run: dotnet test tests/SmaetRec.WinTests -c Release --no-build --logger "console;verbosity=detailed"
      - name: Upload test pictures and videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: artifacts
          if-no-files-found: ignore
