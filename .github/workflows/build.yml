name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build SmaetRec.sln -c Release
      - name: Unit tests
        run: dotnet test tests/SmaetRec.Tests -c Release --no-build --logger "console;verbosity=normal"
